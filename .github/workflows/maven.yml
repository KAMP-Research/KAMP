name: Build and Deploy Update Sites

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout KAMP
        uses: actions/checkout@v4
        with:
          path: KAMP

      - name: Checkout KAMP4APS
        uses: actions/checkout@v4
        with:
          repository: KAMP-Research/KAMP4APS
          path: KAMP4APS

      - name: Checkout KAMP4AS
        uses: actions/checkout@v4
        with:
          repository: KAMP-Research/KAMP4AS
          path: KAMP4AS

      - name: Checkout KAMP4BP
        uses: actions/checkout@v4
        with:
          repository: KAMP-Research/KAMP4BP
          path: KAMP4BP

      - name: Checkout KAMP4HMI
        uses: actions/checkout@v4
        with:
          repository: KAMP-Research/KAMP4HMI
          path: KAMP4HMI

      - name: Checkout KAMP4IEC
        uses: actions/checkout@v4
        with:
          repository: KAMP-Research/KAMP4IEC
          path: KAMP4IEC

      - name: Checkout KAMP4IS
        uses: actions/checkout@v4
        with:
          repository: KAMP-Research/KAMP4IS
          path: KAMP4IS

      - name: Checkout KAMP4REQ
        uses: actions/checkout@v4
        with:
          repository: KAMP-Research/KAMP4REQ
          path: KAMP4REQ

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Create shared build reactor
        run: |
          cat > pom.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>edu.kit.ipd.sdq.kamp</groupId>
            <artifactId>kamp-shared-build-reactor</artifactId>
            <version>1.0.0-SNAPSHOT</version>
            <packaging>pom</packaging>

            <modules>
              <module>KAMP</module>
              <module>KAMP4APS</module>
              <module>KAMP4AS</module>
              <module>KAMP4BP</module>
              <module>KAMP4HMI</module>
              <module>KAMP4IEC</module>
              <module>KAMP4IS</module>
              <module>KAMP4REQ</module>
            </modules>
          </project>
          EOF

      - name: Build KAMP and extensions
        run: mvn -B -U clean verify

      - name: Prepare Pages content
        run: |
          set -euo pipefail

          rm -rf pages-site
          mkdir -p pages-site/{kamp,kamp4aps,kamp4as,kamp4bp,kamp4hmi,kamp4iec,kamp4is,kamp4req,all}
          touch pages-site/.nojekyll

          unzip -q KAMP/releng/edu.kit.ipd.sdq.kamp.updatesite/target/edu.kit.ipd.sdq.kamp.updatesite-*.zip -d pages-site/kamp
          unzip -q KAMP4APS/releng/edu.kit.ipd.sdq.kamp4aps.updatesite/target/edu.kit.ipd.sdq.kamp4aps.updatesite-*.zip -d pages-site/kamp4aps
          unzip -q KAMP4AS/releng/edu.kit.ipd.sdq.kamp4as.updatesite/target/edu.kit.ipd.sdq.kamp4as.updatesite-*.zip -d pages-site/kamp4as
          unzip -q KAMP4BP/releng/edu.kit.ipd.sdq.kamp4bp.updatesite/target/edu.kit.ipd.sdq.kamp4bp.updatesite-*.zip -d pages-site/kamp4bp
          unzip -q KAMP4HMI/releng/edu.kit.ipd.sdq.kamp4hmi.updatesite/target/edu.kit.ipd.sdq.kamp4hmi.updatesite-*.zip -d pages-site/kamp4hmi
          unzip -q KAMP4IEC/releng/edu.kit.ipd.sdq.kamp4iec.updatesite/target/edu.kit.ipd.sdq.kamp4iec.updatesite-*.zip -d pages-site/kamp4iec
          unzip -q KAMP4IS/releng/edu.kit.ipd.sdq.kamp4is.updatesite/target/edu.kit.ipd.sdq.kamp4is.updatesite-*.zip -d pages-site/kamp4is
          unzip -q KAMP4REQ/releng/edu.kit.ipd.sdq.kamp4req.updatesite/target/edu.kit.ipd.sdq.kamp4req.updatesite-*.zip -d pages-site/kamp4req

          P2_TIMESTAMP="$(date +%s%3N)"

          cat > pages-site/all/compositeContent.xml <<EOF
          <?xml version='1.0' encoding='UTF-8'?>
          <?compositeMetadataRepository version='1.0.0'?>
          <repository name='KAMP All Update Site' type='org.eclipse.equinox.internal.p2.metadata.repository.CompositeMetadataRepository' version='1.0.0'>
            <properties size='1'>
              <property name='p2.timestamp' value='${P2_TIMESTAMP}'/>
            </properties>
            <children size='8'>
              <child location='../kamp'/>
              <child location='../kamp4aps'/>
              <child location='../kamp4as'/>
              <child location='../kamp4bp'/>
              <child location='../kamp4hmi'/>
              <child location='../kamp4iec'/>
              <child location='../kamp4is'/>
              <child location='../kamp4req'/>
            </children>
          </repository>
          EOF

          cat > pages-site/all/compositeArtifacts.xml <<EOF
          <?xml version='1.0' encoding='UTF-8'?>
          <?compositeArtifactRepository version='1.0.0'?>
          <repository name='KAMP All Update Site' type='org.eclipse.equinox.internal.p2.artifact.repository.CompositeArtifactRepository' version='1.0.0'>
            <properties size='1'>
              <property name='p2.timestamp' value='${P2_TIMESTAMP}'/>
            </properties>
            <children size='8'>
              <child location='../kamp'/>
              <child location='../kamp4aps'/>
              <child location='../kamp4as'/>
              <child location='../kamp4bp'/>
              <child location='../kamp4hmi'/>
              <child location='../kamp4iec'/>
              <child location='../kamp4is'/>
              <child location='../kamp4req'/>
            </children>
          </repository>
          EOF

          create_update_site_page() {
            local path="$1"
            local title="$2"
            local summary="$3"
            local url="$4"
            local details="$5"

            cat > "pages-site/${path}/index.html" <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>${title} Update Site</title>
            <style>
              :root {
                color-scheme: light;
                --ink: #18212f;
                --muted: #5f6b7a;
                --line: #d8dee8;
                --surface: #ffffff;
                --wash: #f4f7fb;
                --accent: #0b6bcb;
                --accent-dark: #084f97;
              }
              * {
                box-sizing: border-box;
              }
              body {
                margin: 0;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                color: var(--ink);
                background: linear-gradient(180deg, #eef4fa 0, #ffffff 30rem);
              }
              main {
                width: min(920px, calc(100% - 32px));
                margin: 0 auto;
                padding: 56px 0;
              }
              a {
                color: var(--accent);
                font-weight: 650;
                text-decoration: none;
              }
              a:hover {
                color: var(--accent-dark);
                text-decoration: underline;
              }
              header {
                padding-bottom: 28px;
                border-bottom: 1px solid var(--line);
              }
              h1 {
                margin: 0 0 12px;
                font-size: clamp(2rem, 4vw, 3.4rem);
                line-height: 1.05;
                letter-spacing: 0;
              }
              p {
                margin: 0;
                color: var(--muted);
                font-size: 1.05rem;
                line-height: 1.6;
              }
              .panel {
                margin-top: 28px;
                padding: 20px;
                border: 1px solid var(--line);
                border-radius: 8px;
                background: var(--surface);
              }
              .url {
                display: grid;
                grid-template-columns: 1fr auto;
                gap: 10px;
                align-items: center;
                margin-top: 14px;
              }
              code {
                display: block;
                padding: 10px 12px;
                overflow-wrap: anywhere;
                border-radius: 6px;
                background: var(--wash);
                color: #27364a;
                font-size: .94rem;
              }
              button {
                min-height: 40px;
                padding: 0 14px;
                border: 1px solid var(--accent);
                border-radius: 6px;
                background: var(--accent);
                color: #fff;
                font-weight: 650;
                cursor: pointer;
              }
              button:hover {
                background: var(--accent-dark);
                border-color: var(--accent-dark);
              }
              ul {
                margin: 12px 0 0;
                padding-left: 20px;
                color: var(--muted);
                line-height: 1.6;
              }
              @media (max-width: 640px) {
                .url {
                  grid-template-columns: 1fr;
                }
              }
            </style>
          </head>
          <body>
            <main>
              <header>
                <h1>${title}</h1>
                <p>${summary}</p>
              </header>
              <section class="panel">
                <h2>Update Site URL</h2>
                <div class="url">
                  <code id="site-url">${url}</code>
                  <button type="button" data-copy="${url}">Copy URL</button>
                </div>
              </section>
              <section class="panel">
                <h2>Install in Eclipse</h2>
                <ul>
                  <li>Open <strong>Help &gt; Install New Software...</strong>.</li>
                  <li>Paste the update-site URL into the <strong>Work with</strong> field.</li>
                  <li>Select the ${title} feature and continue through the installation wizard.</li>
                  <li>Restart Eclipse when the installer asks for it.</li>
                </ul>
              </section>
              <section class="panel">
                <h2>Contents</h2>
                <p>${details}</p>
              </section>
              <section class="panel">
                <p><a href="../">Back to all KAMP update sites</a></p>
              </section>
            </main>
            <script>
              document.querySelectorAll("[data-copy]").forEach((button) => {
                button.addEventListener("click", async () => {
                  await navigator.clipboard.writeText(button.dataset.copy);
                  const original = button.textContent;
                  button.textContent = "Copied";
                  window.setTimeout(() => {
                    button.textContent = original;
                  }, 1400);
                });
              });
            </script>
          </body>
          </html>
          EOF
          }

          create_update_site_page "kamp" "KAMP" "Core KAMP update site with the base change-propagation framework and modification mark models." "https://kamp-research.github.io/KAMP/kamp/" "Contains the core KAMP feature, modification mark model, edit/editor support, and the base infrastructure required by extension update sites."
          create_update_site_page "kamp4aps" "KAMP4APS" "KAMP extension for automated production systems and automation plant change propagation." "https://kamp-research.github.io/KAMP/kamp4aps/" "Contains APS domain models, deployment context models, field-of-activity annotations, modification marks, and generated EMF tooling."
          create_update_site_page "kamp4as" "KAMP4AS" "KAMP extension for automotive E/E architectures and hardware-aware change propagation." "https://kamp-research.github.io/KAMP/kamp4as/" "Contains the automotive hardware model (ECUs, DCUs, sensors, actuators, buses, gateways, signals, power rails, wiring harness, SOA services), the software-to-hardware deployment model, field-of-activity annotations, modification marks, ARXML and SysML v2 import/export, Excel and graph export, and the Sirius editor."
          create_update_site_page "kamp4bp" "KAMP4BP" "KAMP extension for business-process models connected to Palladio Component Model assets." "https://kamp-research.github.io/KAMP/kamp4bp/" "Contains business-process PCM extensions, data and organization models, field-of-activity annotations, modification marks, and generated EMF tooling."
          create_update_site_page "kamp4hmi" "KAMP4HMI" "KAMP extension for human-machine-interface process models and their relation to IEC software artifacts." "https://kamp-research.github.io/KAMP/kamp4hmi/" "Contains HMI workflow models, mode and condition concepts, HMI modification marks, and generated EMF tooling."
          create_update_site_page "kamp4iec" "KAMP4IEC" "KAMP extension for IEC 61131-style PLC software repositories and change propagation." "https://kamp-research.github.io/KAMP/kamp4iec/" "Contains IEC repository models, program/configuration models, field-of-activity annotations, modification marks, and generated EMF tooling."
          create_update_site_page "kamp4is" "KAMP4IS" "KAMP extension for information systems, PCM models, and component-internal dependencies." "https://kamp-research.github.io/KAMP/kamp4is/" "Contains IS modification marks, field-of-activity annotations, component-internal dependency models, and generated EMF tooling."
          create_update_site_page "kamp4req" "KAMP4REQ" "KAMP extension for requirements, decisions, options, and traceable requirement artefacts." "https://kamp-research.github.io/KAMP/kamp4req/" "Contains requirement-specific modification marks, edit/editor support, and generated EMF tooling for requirement change propagation."
          create_update_site_page "all" "KAMP-All" "Composite update site for KAMP and all published extension update sites." "https://kamp-research.github.io/KAMP/all/" "References the KAMP, KAMP4APS, KAMP4AS, KAMP4BP, KAMP4HMI, KAMP4IEC, KAMP4IS, and KAMP4REQ update sites so Eclipse can resolve the full published KAMP ecosystem from one URL."

          cat > pages-site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>KAMP Eclipse Update Sites</title>
            <style>
              :root {
                color-scheme: light;
                --ink: #18212f;
                --muted: #5f6b7a;
                --line: #d8dee8;
                --surface: #ffffff;
                --wash: #f4f7fb;
                --accent: #0b6bcb;
                --accent-dark: #084f97;
              }
              * {
                box-sizing: border-box;
              }
              body {
                margin: 0;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                color: var(--ink);
                background: linear-gradient(180deg, #eef4fa 0, #ffffff 34rem);
              }
              main {
                width: min(1080px, calc(100% - 32px));
                margin: 0 auto;
                padding: 56px 0;
              }
              header {
                padding-bottom: 32px;
                border-bottom: 1px solid var(--line);
              }
              h1 {
                margin: 0 0 12px;
                font-size: clamp(2rem, 4vw, 3.75rem);
                line-height: 1.05;
                letter-spacing: 0;
              }
              p {
                margin: 0;
                color: var(--muted);
                font-size: 1.05rem;
                line-height: 1.6;
                max-width: 760px;
              }
              .sites {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
                gap: 16px;
                margin: 32px 0;
              }
              .site {
                min-height: 180px;
                padding: 20px;
                border: 1px solid var(--line);
                border-radius: 8px;
                background: var(--surface);
                display: flex;
                flex-direction: column;
                justify-content: space-between;
              }
              .site strong {
                display: block;
                margin-bottom: 8px;
                font-size: 1.2rem;
              }
              .site span {
                color: var(--muted);
                line-height: 1.45;
              }
              .url-row {
                display: grid;
                grid-template-columns: 1fr auto;
                gap: 8px;
                align-items: center;
                margin-top: 10px;
              }
              a {
                color: var(--accent);
                font-weight: 650;
                text-decoration: none;
              }
              a:hover {
                color: var(--accent-dark);
                text-decoration: underline;
              }
              code {
                display: block;
                padding: 10px 12px;
                overflow-wrap: anywhere;
                border-radius: 6px;
                background: var(--wash);
                color: #27364a;
                font-size: .92rem;
              }
              button {
                min-height: 38px;
                padding: 0 12px;
                border: 1px solid var(--accent);
                border-radius: 6px;
                background: var(--accent);
                color: #fff;
                font-weight: 650;
                cursor: pointer;
                white-space: nowrap;
              }
              button:hover {
                background: var(--accent-dark);
                border-color: var(--accent-dark);
              }
              section {
                margin-top: 32px;
              }
              h2 {
                margin: 0 0 12px;
                font-size: 1.35rem;
              }
              @media (max-width: 640px) {
                .url-row {
                  grid-template-columns: 1fr;
                }
              }
            </style>
          </head>
          <body>
            <main>
              <header>
                <h1>KAMP Eclipse Update Sites</h1>
                <p>Use the individual repositories for targeted installations, or use KAMP-All when Eclipse should resolve KAMP and all published extensions from one update site.</p>
              </header>

              <div class="sites">
                <article class="site">
                  <div>
                    <strong>KAMP-All</strong>
                    <span>Composite update site for KAMP and all extensions.</span>
                    <div class="url-row">
                      <code>https://kamp-research.github.io/KAMP/all/</code>
                      <button type="button" data-copy="https://kamp-research.github.io/KAMP/all/">Copy</button>
                    </div>
                  </div>
                  <a href="all/">Open update site</a>
                </article>
                <article class="site">
                  <div>
                    <strong>KAMP</strong>
                    <span>Core KAMP update site.</span>
                    <div class="url-row">
                      <code>https://kamp-research.github.io/KAMP/kamp/</code>
                      <button type="button" data-copy="https://kamp-research.github.io/KAMP/kamp/">Copy</button>
                    </div>
                  </div>
                  <a href="kamp/">Open update site</a>
                </article>
                <article class="site">
                  <div>
                    <strong>KAMP4APS</strong>
                    <span>Automation production systems extension update site.</span>
                    <div class="url-row">
                      <code>https://kamp-research.github.io/KAMP/kamp4aps/</code>
                      <button type="button" data-copy="https://kamp-research.github.io/KAMP/kamp4aps/">Copy</button>
                    </div>
                  </div>
                  <a href="kamp4aps/">Open update site</a>
                </article>
                <article class="site">
                  <div>
                    <strong>KAMP4AS</strong>
                    <span>Automotive E/E architecture extension update site.</span>
                    <div class="url-row">
                      <code>https://kamp-research.github.io/KAMP/kamp4as/</code>
                      <button type="button" data-copy="https://kamp-research.github.io/KAMP/kamp4as/">Copy</button>
                    </div>
                  </div>
                  <a href="kamp4as/">Open update site</a>
                </article>
                <article class="site">
                  <div>
                    <strong>KAMP4BP</strong>
                    <span>Business process extension update site.</span>
                    <div class="url-row">
                      <code>https://kamp-research.github.io/KAMP/kamp4bp/</code>
                      <button type="button" data-copy="https://kamp-research.github.io/KAMP/kamp4bp/">Copy</button>
                    </div>
                  </div>
                  <a href="kamp4bp/">Open update site</a>
                </article>
                <article class="site">
                  <div>
                    <strong>KAMP4HMI</strong>
                    <span>Human-machine-interface extension update site.</span>
                    <div class="url-row">
                      <code>https://kamp-research.github.io/KAMP/kamp4hmi/</code>
                      <button type="button" data-copy="https://kamp-research.github.io/KAMP/kamp4hmi/">Copy</button>
                    </div>
                  </div>
                  <a href="kamp4hmi/">Open update site</a>
                </article>
                <article class="site">
                  <div>
                    <strong>KAMP4IEC</strong>
                    <span>IEC extension update site.</span>
                    <div class="url-row">
                      <code>https://kamp-research.github.io/KAMP/kamp4iec/</code>
                      <button type="button" data-copy="https://kamp-research.github.io/KAMP/kamp4iec/">Copy</button>
                    </div>
                  </div>
                  <a href="kamp4iec/">Open update site</a>
                </article>
                <article class="site">
                  <div>
                    <strong>KAMP4IS</strong>
                    <span>Information systems extension update site.</span>
                    <div class="url-row">
                      <code>https://kamp-research.github.io/KAMP/kamp4is/</code>
                      <button type="button" data-copy="https://kamp-research.github.io/KAMP/kamp4is/">Copy</button>
                    </div>
                  </div>
                  <a href="kamp4is/">Open update site</a>
                </article>
                <article class="site">
                  <div>
                    <strong>KAMP4REQ</strong>
                    <span>Requirements extension update site.</span>
                    <div class="url-row">
                      <code>https://kamp-research.github.io/KAMP/kamp4req/</code>
                      <button type="button" data-copy="https://kamp-research.github.io/KAMP/kamp4req/">Copy</button>
                    </div>
                  </div>
                  <a href="kamp4req/">Open update site</a>
                </article>
              </div>

              <section>
                <h2>Installation</h2>
                <p>In Eclipse, open <strong>Help &gt; Install New Software...</strong> and paste one of the update-site URLs above into the <strong>Work with</strong> field.</p>
              </section>
            </main>
            <script>
              document.querySelectorAll("[data-copy]").forEach((button) => {
                button.addEventListener("click", async () => {
                  await navigator.clipboard.writeText(button.dataset.copy);
                  const original = button.textContent;
                  button.textContent = "Copied";
                  window.setTimeout(() => {
                    button.textContent = original;
                  }, 1400);
                });
              });
            </script>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
